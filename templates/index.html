<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Cálculo: Derivadas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- MathJax: dibuja las fórmulas LaTeX que escribe el modelo, p. ej. \( f'(a) \) o \[ ... \] -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']]
            },
            options: {
                // Los elementos con esta clase (tools y fuentes) no se procesan
                ignoreHtmlClass: 'tex2jax_ignore',
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">f'</div>
            <div class="chat-title">
                <h3>Tutor de Cálculo: Derivadas</h3>
                <p>Activo • Asistente</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">¡Hola! Soy tu tutor inteligente de derivadas. Pregúntame sobre la definición de derivada, las reglas de derivación, el teorema del valor medio, L'Hôpital, polinomios de Taylor o convexidad.</div>
        </div>

        <div class="chat-input-area">
            <form id="chatForm">
                <input type="text" id="userInput" placeholder="Envía un mensaje..." autocomplete="off" required>
                <button type="submit" id="sendBtn">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Historial de la conversación: se envía al servidor en cada mensaje
        // para que el tutor entienda las preguntas de seguimiento.
        const historial = [];

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // 1. Añadimos la burbuja del usuario inmediatamente
            appendMessage(message, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // 2. Indicador de carga
            const loadingId = appendMessage('Pensando...', 'bot');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, history: historial.slice(-12) })
                });
                const data = await response.json();

                // Quitamos el mensaje de carga y ponemos la respuesta real
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.remove();
                }

                // Respuesta + tools usadas + fuentes separadas (base y web)
                appendMessage(data.response, 'bot', data.sources, data.tools);

                // Guardamos el turno en el historial solo si todo salió bien
                if (response.ok) {
                    historial.push({ role: 'user', text: message });
                    historial.push({ role: 'bot', text: data.response });
                }

            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.remove();
                }
                appendMessage('Hubo un error al conectar con el tutor.', 'bot');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        // Limpieza cosmética del texto que sale del PDF (fuentes matemáticas mal codificadas).
        function limpiarFragmento(texto) {
            return String(texto || '')
                .replace(/\/NUL/g, '−')
                .replace(/lKım/g, 'lím')
                .replace(/fi (?=[a-záéíóúñ])/g, 'fi')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Línea con las herramientas que usó el agente en esta respuesta
        function crearBloqueTools(tools) {
            const bloque = document.createElement('div');
            bloque.classList.add('tools-usadas', 'tex2jax_ignore');
            bloque.textContent = 'Herramientas usadas: ' + tools.join(', ');
            return bloque;
        }

        // Bloque de fuentes (uno para la base y otro para la web)
        function crearBloqueFuentes(titulo, lista, esWeb) {
            const bloque = document.createElement('div');
            bloque.classList.add('fuentes', 'tex2jax_ignore');

            const encabezado = document.createElement('div');
            encabezado.classList.add('fuentes-titulo');
            encabezado.textContent = titulo;
            bloque.appendChild(encabezado);

            lista.forEach((s) => {
                const item = document.createElement('div');
                item.classList.add('fuente');

                if (esWeb) {
                    // Solo se permiten enlaces http(s)
                    if (s.url && /^https?:\/\//i.test(s.url)) {
                        const enlace = document.createElement('a');
                        enlace.href = s.url;
                        enlace.target = '_blank';
                        enlace.rel = 'noopener noreferrer';
                        enlace.textContent = s.documento || s.url;
                        item.appendChild(enlace);
                    } else {
                        item.textContent = s.documento || 'Fuente web';
                    }
                } else {
                    const enlace = document.createElement('a');
                    enlace.href = '/documento#page=' + encodeURIComponent(s.pagina);
                    enlace.target = '_blank';
                    enlace.rel = 'noopener noreferrer';
                    enlace.textContent = s.documento + ', pág. ' + s.pagina;
                    item.appendChild(enlace);
                }

                if (s.fragmento) {
                    const fragmento = document.createElement('p');
                    fragmento.textContent = '«' + limpiarFragmento(s.fragmento) + '»';
                    item.appendChild(fragmento);
                }
                bloque.appendChild(item);
            });
            return bloque;
        }

        function appendMessage(text, sender, sources, tools) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            // Identificador seguro basado en tiempo para evitar errores de sintaxis
            const id = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            msgDiv.id = id;
            msgDiv.style.whiteSpace = 'pre-wrap';

            // Texto principal (aquí se renderizan las fórmulas)
            const cuerpo = document.createElement('div');
            cuerpo.textContent = sender === 'bot' ? String(text).replace(/\*\*/g, '') : text;
            msgDiv.appendChild(cuerpo);

            if (sender === 'bot') {
                // Tools usadas
                if (tools && tools.length > 0) {
                    msgDiv.appendChild(crearBloqueTools(tools));
                }

                // Fuentes separadas: base (PDF) y web
                const lista = sources || [];
                const deBase = lista.filter((s) => s.tipo !== 'web');
                const deWeb = lista.filter((s) => s.tipo === 'web');
                if (deBase.length > 0) {
                    msgDiv.appendChild(crearBloqueFuentes('Fuentes de la base (PDF)', deBase, false));
                }
                if (deWeb.length > 0) {
                    msgDiv.appendChild(crearBloqueFuentes('Fuentes web', deWeb, true));
                }
            }

            chatMessages.appendChild(msgDiv);

            // Dibuja las fórmulas de las respuestas del asistente
            if (sender === 'bot' && window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([cuerpo]).then(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }).catch(() => {});
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
